[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtspy"
version = "0.1.0"
description = "Python implementation of RTS2 (Remote Telescope System) device drivers and daemons"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GNU General Public License v3.0"}
authors = [
    {name = "Martin Jelínek", email = "martin.jelinek@asu.cas.cz"},
]
maintainers = [
    {name = "Martin Jelínek", email = "martin.jelinek@asu.cas.cz"},
]
keywords = [
    "astronomy",
    "observatory",
    "rts2",
    "telescope",
    "robotics",
    "grb",
    "device-drivers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0",
    "gcn-kafka>=0.3.0",
    "astropy>=5.0",
    "pyserial>=3.4",
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/MATES-Observatory/rtspy"
Documentation = "https://github.com/MATES-Observatory/rtspy#readme"
Repository = "https://github.com/MATES-Observatory/rtspy"
Issues = "https://github.com/MATES-Observatory/rtspy/issues"

[project.scripts]
# Production daemons. rtspy-gcnkafka and rtspy-queuer are the names
# rts2-start resolves for the /etc/rts2/services lines "gcnkafka KAFKA ..."
# and "queuer QUEUE ...", and so the names rts2-stop's comm check expects -
# they used to be shell wrappers, now they daemonize like the drivers below.
# rtspy-grbd/rtspy-queue-selector are the same program under the old names,
# for running by hand; rts2-stop will not stop a copy started that way.
rtspy-gcnkafka = "rtspy.daemons.grbd:main"
rtspy-queuer = "rtspy.daemons.queue_selector:main"
rtspy-grbd = "rtspy.daemons.grbd:main"
rtspy-queue-selector = "rtspy.daemons.queue_selector:main"
rtspy-watcher = "rtspy.daemons.watcher:main"

# Hardware drivers. Everything rtspy installs is named rtspy-*, never rts2-*:
# the two projects keep separate namespaces so they can never collide, and
# C++ RTS2 already ships an rts2-focusd-dummy and an rts2-filterd-dummy of
# its own. rts2-start/rts2-stop know about this - they resolve a line in
# /etc/rts2/devices by trying rts2-<family>-<type> first and
# rtspy-<family>-<type> second - so a device line needs no special syntax and
# the C++ implementation stays the default where both exist.
#
# rts2-stop kills only a process whose /proc/<pid>/comm matches the program
# name it resolved; a console script named rtspy-focusd-toptec reports
# rtspy-focusd-t (comm is 15 characters) and matches, because Linux takes
# comm from the shebang script rather than from the interpreter.
#
# These daemonize themselves (see rtspy/core/daemon.py); no shell wrapper.
rtspy-filterd-dummy = "rtspy.drivers.filterd_dummy:main"
rtspy-filterd-ovis = "rtspy.drivers.filterd_ovis:main"
rtspy-focusd-dummy = "rtspy.drivers.focusd_dummy:main"
rtspy-focusd-toptec = "rtspy.drivers.toptec:main"
rtspy-sensor-temp = "rtspy.drivers.sensor_temp:main"

# CLI utilities. rtspy-*, like everything else rtspy installs: these land in
# /usr/local/bin, which precedes /usr/bin, so an rts2-* name here would
# shadow a C++ RTS2 program of that name - and gets cleaned out by an RTS2
# install for exactly that reason (it happened on hpl on 2026-09-17).
rtspy-value = "rtspy.cli.valuetool:main"
rtspy-grbinfo = "rtspy.cli.grbinfo:main"
rtspy-queue-manual = "rtspy.cli.queuemanual:main"
rtspy-addtarget = "rtspy.cli.addtarget:main"

# Shell scripts installed via setup.py scripts= (rtspy/scripts/):
# rtspy-observe, rtspy-rotate-log, rtspy-split-log. The daemon wrappers that
# used to live there are gone - every daemon backgrounds itself now.

[tool.setuptools]
packages = [
    "rtspy",
    "rtspy.core",
    "rtspy.drivers",
    "rtspy.daemons",
    "rtspy.cli",
]

[tool.setuptools.package-data]
rtspy = ["py.typed"]
"rtspy.scripts" = ["*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
