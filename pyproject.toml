[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtspy"
version = "0.1.0"
description = "Python implementation of RTS2 (Remote Telescope System) device drivers and daemons"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GNU General Public License v3.0"}
authors = [
    {name = "Martin Jelínek", email = "martin.jelinek@asu.cas.cz"},
]
maintainers = [
    {name = "Martin Jelínek", email = "martin.jelinek@asu.cas.cz"},
]
keywords = [
    "astronomy",
    "observatory",
    "rts2",
    "telescope",
    "robotics",
    "grb",
    "device-drivers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0",
    "gcn-kafka>=0.3.0",
    "astropy>=5.0",
    "pyserial>=3.4",
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/MATES-Observatory/rtspy"
Documentation = "https://github.com/MATES-Observatory/rtspy#readme"
Repository = "https://github.com/MATES-Observatory/rtspy"
Issues = "https://github.com/MATES-Observatory/rtspy/issues"

[project.scripts]
# Production daemons
rtspy-grbd = "rtspy.daemons.grbd:main"
rtspy-queue-selector = "rtspy.daemons.queue_selector:main"
rtspy-watcher = "rtspy.daemons.watcher:main"

# Hardware drivers. Installed under the rts2- names the RTS2 launcher
# expects: a /etc/rts2/devices line "focusd toptec F0" runs
# rts2-focusd-toptec, and rts2-stop will only kill a process whose
# /proc/<pid>/comm matches the first 15 characters of that name - which a
# console script of this name gets for free, since Linux takes comm from
# the shebang script rather than from the interpreter. These daemonize
# themselves (see rtspy/core/daemon.py); no shell wrapper is involved.
rts2-filterd-ovis = "rtspy.drivers.filterd_ovis:main"
rts2-focusd-toptec = "rtspy.drivers.toptec:main"
rts2-sensor-temp = "rtspy.drivers.sensor_temp:main"

# The two dummies keep the rtspy- prefix on purpose: C++ RTS2 ships its own
# rts2-focusd-dummy and rts2-filterd-dummy, and /usr/local/bin comes before
# /usr/bin, so naming these rts2-* would silently shadow the packaged
# drivers with a different implementation. They are test drivers; nothing
# starts them from /etc/rts2/devices.
rtspy-filterd-dummy = "rtspy.drivers.filterd_dummy:main"
rtspy-focusd-dummy = "rtspy.drivers.focusd_dummy:main"

# CLI utilities (using rts2- prefix for ecosystem integration)
rts2-value = "rtspy.cli.valuetool:main"
rts2-grbinfo = "rtspy.cli.grbinfo:main"
rts2-queue-manual = "rtspy.cli.queuemanual:main"
rts2-addtarget = "rtspy.cli.addtarget:main"

# Shell scripts installed via setup.py scripts= (rtspy/scripts/):
# rts2-gcnkafka, rts2-queuer, rts2-observe. The per-driver rts2-* daemon
# wrappers that used to live there are gone - the drivers background
# themselves now.

[tool.setuptools]
packages = [
    "rtspy",
    "rtspy.core",
    "rtspy.drivers",
    "rtspy.daemons",
    "rtspy.cli",
]

[tool.setuptools.package-data]
rtspy = ["py.typed"]
"rtspy.scripts" = ["*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
